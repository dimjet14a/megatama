<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Portal - MEGATAMA</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="src/css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
    
    <style>
        .login-bg {
            background-image: url('https://images.unsplash.com/photo-1541888086925-ebbc31bc0888?q=80&w=2070&auto=format&fit=crop');
            background-size: cover;
            background-position: center;
        }
        .glass-card {
            background: rgba(11, 31, 58, 0.7);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }
    </style>
</head>
<body class="login-bg h-screen w-full flex items-center justify-center relative font-sans">
    <div class="absolute inset-0 bg-black/60 z-0"></div>
    
    <!-- Tombol Kembali -->
    <a href="index.html" class="absolute top-6 left-6 text-gray-300 hover:text-white transition-colors text-sm flex items-center z-20" data-aos="fade-right">
        <i class="fas fa-arrow-left mr-2"></i> Kembali ke Beranda
    </a>

    <!-- Login Card -->
    <div class="glass-card w-full max-w-md p-8 sm:p-10 rounded-2xl z-10 mx-4" data-aos="zoom-in" data-aos-duration="800">
        <div class="text-center mb-8">
            <div class="inline-flex items-center justify-center w-16 h-16 rounded-full bg-corporate-bright/20 mb-4 border border-corporate-bright/30">
                <i class="fas fa-hard-hat text-3xl text-corporate-bright"></i>
            </div>
            <h1 class="text-3xl font-bold text-white tracking-wide">MEGATAMA</h1>
            <p class="text-gray-300 mt-2 text-sm">Project Monitoring Portal</p>
        </div>

        <form id="loginForm" class="space-y-6">
            <div>
                <label class="block text-sm font-medium text-gray-300 mb-2">Username / Email</label>
                <div class="relative">
                    <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                        <i class="fas fa-user text-gray-400"></i>
                    </div>
                    <input type="text" id="username" required class="w-full pl-11 pr-4 py-3 bg-white/5 border border-white/20 rounded-xl text-white placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-corporate-bright focus:border-transparent transition-all" placeholder="admin@megatama.com">
                </div>
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-300 mb-2">Password</label>
                <div class="relative">
                    <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                        <i class="fas fa-lock text-gray-400"></i>
                    </div>
                    <input type="password" id="password" required class="w-full pl-11 pr-12 py-3 bg-white/5 border border-white/20 rounded-xl text-white placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-corporate-bright focus:border-transparent transition-all" placeholder="••••••••">
                    <div class="absolute inset-y-0 right-0 pr-4 flex items-center cursor-pointer" id="togglePassword">
                        <i class="fas fa-eye text-gray-400 hover:text-white transition-colors"></i>
                    </div>
                </div>
            </div>

            <div class="flex items-center justify-between">
                <div class="flex items-center">
                    <input type="checkbox" id="remember" class="w-4 h-4 rounded border-gray-400 text-corporate-bright focus:ring-corporate-bright bg-white/10">
                    <label for="remember" class="ml-2 text-sm text-gray-300">Remember Me</label>
                </div>
                <a href="#" class="text-sm text-corporate-bright hover:text-white transition-colors">Lupa Password?</a>
            </div>

            <button type="submit" class="w-full py-3 px-4 bg-corporate-bright hover:bg-blue-600 text-white font-bold rounded-xl shadow-lg hover:shadow-corporate-bright/30 transition-all duration-300 flex items-center justify-center gap-2 transform hover:-translate-y-1">
                <span>Masuk Dashboard</span>
            </button>
        </form>
    </div>

    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <script src="src/js/auth.js"></script>
</body>
</html>
